server:
  port: ${CONTROL_PLANE_PORT:8090}

spring:
  application:
    name: node-control-plane
  datasource:
    url: jdbc:h2:file:./data/control-plane;AUTO_SERVER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

control-plane:
  heartbeat:
    interval-ms: ${HEARTBEAT_INTERVAL_MS:15000}
  bootstrap:
    enabled: ${NODE_MANAGER_BOOTSTRAP_ENABLED:true}
    name: ${NODE_MANAGER_NAME:Vultr Node}
    base-url: ${NODE_MANAGER_BASE_URL:http://198.13.46.231:8088}
    token: ${NODE_MANAGER_TOKEN:}
  security:
    admin-token: ${CONTROL_PLANE_ADMIN_TOKEN:}

