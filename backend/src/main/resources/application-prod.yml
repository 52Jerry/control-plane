# NiuSu Control Plane 生产配置。
# 日常部署只需填写 .env.example 中列出的环境变量，其余项目使用安全默认值。

server:
  address: 0.0.0.0
  port: 8090
  forward-headers-strategy: framework

spring:
  config:
    activate:
      on-profile: prod

  application:
    name: node-control-plane

  datasource:
    # 一般只需填写 CONTROL_PLANE_DB_HOST；特殊场景可用 CONTROL_PLANE_DB_URL 覆盖完整地址。
    url: ${CONTROL_PLANE_DB_URL:jdbc:mysql://${CONTROL_PLANE_DB_HOST}:${CONTROL_PLANE_DB_PORT:3306}/${CONTROL_PLANE_DB_NAME:control-plane}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=true}
    username: ${CONTROL_PLANE_DB_USERNAME}
    password: ${CONTROL_PLANE_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      # 生产环境只校验已版本化/兼容迁移后的结构，不让 Hibernate
      # 在启动时隐式创建、修改或删除业务表。
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

control-plane:
  # 可选。反向代理正确传递 X-Forwarded-* 时可留空；多层代理时建议填写公网 HTTPS 地址。
  public-url: ${CONTROL_PLANE_PUBLIC_URL:}

  bootstrap:
    enabled: false

  schema:
    # 生产发布前由受控迁移脚本准备结构，应用启动不自动 ALTER TABLE。
    compatibility-migration-enabled: false

  security:
    registration-token: ${CONTROL_PLANE_REGISTRATION_TOKEN:}
    encryption-key: ${CONTROL_PLANE_ENCRYPTION_KEY}
    login-username: ${CONTROL_PLANE_LOGIN_USERNAME:}
    login-password: ${CONTROL_PLANE_LOGIN_PASSWORD:}

  provisioning:
    default-max-users: ${NODE_DEFAULT_MAX_USERS:500}
    default-traffic-limit-bytes: ${NODE_DEFAULT_TRAFFIC_LIMIT_BYTES:214748364800}
    default-max-source-ips: ${NODE_DEFAULT_MAX_SOURCE_IPS:5}
    operation-stale-after-ms: ${PROVISIONING_OPERATION_STALE_AFTER_MS:120000}
    # 生产默认要求新版 Node Manager 返回完整五协议。
    require-complete-protocols-all: ${CONTROL_PLANE_REQUIRE_COMPLETE_PROTOCOLS_ALL:true}

  installation:
    token-ttl-seconds: ${CONTROL_PLANE_INSTALL_TOKEN_TTL_SECONDS:600}
    claim-ttl-seconds: ${CONTROL_PLANE_INSTALL_CLAIM_TTL_SECONDS:120}

  geo-ip:
    enabled: ${CONTROL_PLANE_GEOIP_ENABLED:true}
    base-url: ${CONTROL_PLANE_GEOIP_BASE_URL:https://get.geojs.io/v1/ip/geo}
    fallback-base-url: ${CONTROL_PLANE_GEOIP_FALLBACK_BASE_URL:https://ipwho.is}
    secondary-fallback-base-url: ${CONTROL_PLANE_GEOIP_SECONDARY_FALLBACK_BASE_URL:http://ip-api.com/json}
    connect-timeout-millis: ${CONTROL_PLANE_GEOIP_CONNECT_TIMEOUT_MILLIS:1500}
    read-timeout-millis: ${CONTROL_PLANE_GEOIP_READ_TIMEOUT_MILLIS:2500}
    cache-ttl-seconds: ${CONTROL_PLANE_GEOIP_CACHE_TTL_SECONDS:86400}
    failure-cache-ttl-seconds: ${CONTROL_PLANE_GEOIP_FAILURE_CACHE_TTL_SECONDS:120}
